name: identifier-gate
on: [push, pull_request]
jobs:
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the message scan needs history, not a shallow clone
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for committed work-domain identifiers
        env:
          FORBIDDEN_IDENTIFIERS: ${{ secrets.NO_SUCH_SECRET_NEGATIVE_CONTROL }}
        run: python3 scripts/check_committed_identifiers.py
      - name: Check commit messages for work-domain identifiers
        env:
          FORBIDDEN_IDENTIFIERS: ${{ secrets.NO_SUCH_SECRET_NEGATIVE_CONTROL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # On a PR, scan the branch's own commits; on a push, scan what arrived.
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..HEAD"
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "scanning commit messages in $range"
          python3 scripts/check_committed_identifiers.py --rev-range "$range"
